name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MouZe-windows
          - os: ubuntu-latest
            artifact: MouZe-linux
          # macOS can't change the system cursor with public APIs, but effects, Studio and exports work.
          - os: macos-latest
            artifact: MouZe-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install . pyinstaller
      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --windowed --name MouZe
          --icon packaging/mouze.ico
          --collect-data mouze
          packaging/launcher.py
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../${{ matrix.artifact }}.zip MouZe
          elif [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent MouZe.app ../${{ matrix.artifact }}.zip
          else tar czf ../${{ matrix.artifact }}.tar.gz MouZe; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact }}.*
