name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v1.0.0 (creates the tag). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MouZe-windows
          - os: ubuntu-latest
            artifact: MouZe-linux
          # macOS can't change the system cursor with public APIs, but effects, Studio and exports work.
          - os: macos-latest
            artifact: MouZe-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install . pyinstaller
      - name: Build
        shell: bash
        run: >
          pyinstaller --noconfirm --windowed --name MouZe
          --icon packaging/mouze.ico
          --collect-data mouze
          packaging/launcher.py
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../${{ matrix.artifact }}.zip MouZe
          elif [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent MouZe.app ../${{ matrix.artifact }}.zip
          else tar czf ../${{ matrix.artifact }}.tar.gz MouZe; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  # One job publishes the release, so parallel builds can't race to create it.
  # A failed platform build leaves that platform out instead of blocking the others.
  release:
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MouZe ${{ inputs.tag || github.ref_name }}
          body_path: packaging/RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
